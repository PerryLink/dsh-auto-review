<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="fig-title">
<title id="fig-title">dsh-auto-review — the claim funnel: four gates (session, ai policy, per-turn budgets, circuit) narrow every boundary-crossing approval/request down to the read-only reviewer room and three outcome doors (allow, deny, fallback); non-ai and unavailable requests bypass through next() to the human answerer, never and reviewer failures close deterministically, and the log-only audit chain runs underneath</title>
