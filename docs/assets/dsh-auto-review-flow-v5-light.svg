<text x="1056" y="50" fill="#8a8fa2" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="400" text-anchor="end">src/runtime.ts · answerCore()</text>
<text x="1056" y="74" fill="#4B67B4" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="400" text-anchor="end">/auto-review on|off|status|approve [n]</text>
