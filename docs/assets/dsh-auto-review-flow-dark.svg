<text x="385" y="320" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12">policy≠ai → next() → human answerer</text>
<path d="M845 236v52" stroke="#4B67B4" stroke-width="2" stroke-dasharray="5 5"/>
