<text x="845" y="208" fill="#8b949e" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11">{decision,reason,riskLevel}</text>
<path d="M945 188h30" stroke="#8b949e" stroke-width="3"/>
<path d="M973 181l10 7-10 7" fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="980" y="140" width="190" height="96" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<text x="1075" y="180" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="700">allow→allowed-once</text>
<text x="1075" y="208" fill="#8b949e" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11">deny→[auto-review]</text>
