name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub Release
  id-token: write # npm provenance

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run verify:self-contained
      - run: node scripts/check-host-versions.mjs

  publish:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          # No registry-url on purpose: it writes
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into .npmrc, and with
          # the secret retired that line is an empty bearer token - the registry
          # answers 404 on PUT instead of letting npm/pnpm do the OIDC exchange.
      - run: pnpm install --frozen-lockfile
      - name: Verify the tag matches the package version
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${tag}"
            exit 1
          fi
      # prepublishOnly re-runs the full gate on the fresh checkout. Trusted
      # publishing: the OIDC token (id-token: write above) replaces NPM_TOKEN, so
      # the empty-token guard is gone on purpose - with the secret retired it would
      # fail every release. A version already on the registry still skips.
      - name: Upgrade npm and show what the publish will authenticate with
        shell: bash
        run: |
          npm install -g npm@^11.5.1
          echo "npm: $(npm --version)"
          echo "pnpm: $(pnpm --version)"
          echo "registry: $(npm config get registry)"
          if [ -f .npmrc ]; then echo "--- workspace .npmrc ---"; cat .npmrc; else echo "no workspace .npmrc"; fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then echo "OIDC request TOKEN: present"; else echo "OIDC request TOKEN: MISSING"; fi
      - name: Publish to npm
        shell: bash
        env:
          # npm/pnpm's OIDC exchange never throws: a failure is only visible at
          # verbose level, otherwise the step just fails with no reason.
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-auto-review@${version}" version >/dev/null 2>&1; then
            echo "dsh-auto-review@${version} is already published; skipping npm publish"
          else
            # See the guard above: npm's read side can lag a successful publish, so a re-pushed
            # tag can miss it and hit E409 ("Cannot publish over previously staged version"). That
            # means the version already exists, so report it as done instead of failing the job.
            set +e
            out="$(pnpm publish --no-git-checks --provenance 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$out"
            if [ "$status" -ne 0 ]; then
              if printf '%s' "$out" | grep -q 'E409'; then
                echo "already on the registry (E409); treating the publish as done"
              else
                exit "$status"
              fi
            fi
          fi
      # Advisory only: npm's read side can lag minutes behind a successful publish, and a hard
      # failure here skipped the GitHub Release (observed on dsh-cert-mcp v0.2.1).
      - name: Verify the version is live on the registry (advisory)
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 12); do
            if npm view "dsh-auto-review@${version}" version >/dev/null 2>&1; then
              echo "dsh-auto-review@${version} is live on the registry"
              exit 0
            fi
            echo "attempt ${attempt}: not visible on the registry yet; retrying"
            sleep 15
          done
          echo "::warning::dsh-auto-review@${version} is still not visible on the registry after ~3 minutes (the publish step reported success; npm's read side is lagging)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
