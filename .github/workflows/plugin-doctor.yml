name: plugin-doctor
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    name: dsh-plugin-doctor (static R/K)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != '' && hashFiles('package-lock.json') == ''
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          else npm install --no-audit --no-fund
          fi
      - name: Build (if present)
        run: npm run build --if-present || true
      - name: Run dsh-plugin-doctor
        env:
          # Group names are YAML \u escapes so this file stays pure ASCII: a mojibake
          # round-trip used to make --only match no group, and the gate then passed
          # silently with zero checks. The guard below fails loudly instead.
          DOCTOR_ONLY: "\u9759\u6001\u00b7\u5305\u7ed3\u6784,\u9759\u6001\u00b7cordis \u5951\u7ea6\u626b\u63cf"
        run: |
          if [ -z "$DOCTOR_ONLY" ]; then echo "DOCTOR_ONLY is empty"; exit 1; fi
          set +e
          out="$(npx --yes @perrylink/dsh-plugin-doctor@0.1.4 --repo . --no-smoke --only "$DOCTOR_ONLY" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"
          echo "$out" | grep -q 'R0 ' || { echo "::error::doctor ran no R checks"; exit 1; }
          echo "$out" | grep -q 'K1 ' || { echo "::error::doctor ran no K checks"; exit 1; }
          exit $code
