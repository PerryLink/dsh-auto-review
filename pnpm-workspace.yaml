packages:
  - .
# The pinned `@deepseek-ai/*` family is published inside the registry's
# minimum-release-age window; exclude the whole scope so installs (local and
# CI frozen-lockfile) resolve regardless of the clock.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
allowBuilds:
  # Lifecycle scripts of these packages only validate or restore their shipped
  # prebuilt native binaries (no compilation); allow them so the isolated
  # git-install prepare env (which reads THIS file from the tarball) and local
  # installs do not fail with ERR_PNPM_IGNORED_BUILDS. Git users still need
  # the same keys in the profile's pnpm-workspace.yaml — the `dsh` CLI prints
  # them verbatim.
  esbuild: true
  '@deepseek-ai/dsh-subprocess-local': true
  node-pty: true
  koffi: true
# Whole-graph pin to the host line (dsh-v0.1.7-rc.2).
#
# Only the DIRECT `@deepseek-ai/dsh-*` dependencies can be pinned in
# package.json, because pnpm 11 no longer reads a `pnpm` field there. Everything
# else in the graph is a PEER, and `autoInstallPeers` satisfies a peer with
# whatever version its range allows — the frozen `dsh-agent-spine-demo@0.1.1-rc.2`
# subgraph still declares `^0.1.1-rc.2`/`^0.1.2-alpha.2` peers, so pnpm happily
# filled them with 0.1.1/0.1.2 previews. Those previews do not carry the exports
# the 0.1.7 host packages import (`assertNever` from dsh-llm,
# `longEdgeDimensions` from dsh-attachment, `SessionAlreadyExistsError` from
# dsh-session-persistence, the `dsh-subprocess/control` subpath), so four rows of
# the shipped `eval/cordis.yml` failed to IMPORT and `dsh-eval` booted a
# composition with 7 of 18 entries inactive. This map is the fix.
#
# It is a pin, not a widening: every listed package IS published on
# 0.1.7-rc.2, and that line is what this package's own dependencies and the
# host already require. Do NOT re-add a row for a package the host has deleted
# (`dsh-agent-presets`, `dsh-code-runtime`) — pnpm would fail to resolve it.
overrides:
  '@deepseek-ai/dsh-agent': 0.1.7-rc.2
  '@deepseek-ai/dsh-agent-instructions': 0.1.7-rc.2
  '@deepseek-ai/dsh-agent-loop': 0.1.7-rc.2
